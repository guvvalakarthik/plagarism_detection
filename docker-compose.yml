services:
  database:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: sourcelens
      POSTGRES_USER: sourcelens
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sourcelens -d sourcelens"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - sourcelens-postgres:/var/lib/postgresql/data

  migrate:
    build: .
    command: ["python", "scripts/migrate.py"]
    environment:
      DATABASE_URL: postgresql://sourcelens:local-development-only@database:5432/sourcelens
    depends_on:
      database:
        condition: service_healthy

  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: postgresql://sourcelens:local-development-only@database:5432/sourcelens
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  sourcelens-postgres:
