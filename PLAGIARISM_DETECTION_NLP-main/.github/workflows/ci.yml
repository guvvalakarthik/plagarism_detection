name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    working-directory: PLAGIARISM_DETECTION_NLP-main

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: sourcelens_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sourcelens_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      SOURCELENS_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sourcelens_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: PLAGIARISM_DETECTION_NLP-main/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev,storage]"
      - run: ruff check .
      - run: pytest
      - run: python scripts/evaluate.py dataset_new.csv
      - run: docker build -t sourcelens:test .
